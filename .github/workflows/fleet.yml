name: Fleet dashboard

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate fleet dashboard + cooking block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: NagaSatyaPhanindraVallabhaneni
        run: python3 tools/fleet.py
      - name: Commit updates
        run: |
          git config user.name "fleet-bot"
          git config user.email "fleet-bot@users.noreply.github.com"
          git add assets/fleet.svg README.md
          git diff --cached --quiet || (git commit -m "chore: refresh fleet dashboard [skip ci]" && git push)
